name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 环境方案（依据三轮 CI 实测证据确定）：
#   · GitHub 的 ubuntu-latest runner **预装并运行 MySQL 8.0(3306) 与 Redis(6379)**
#     → services: 声明同名端口会抢占 → 容器创建失败 → job 秒挂（最初 25 秒挂的真凶）
#   · 1ms.run 是国内代理，GitHub runner 在美国不可达 → 不能依赖该镜像源
#   结论：**不使用 services 与任何容器镜像**，直接用 runner 自带的 MySQL/Redis
#   （systemctl start，零镜像拉取、零端口冲突、零速率限制）——GitHub 官方推荐做法。
#   本地等价验证见 deploy/ci-local-rehearsal.sh（用本地容器模拟，本机 3306/6379 空闲故无冲突）。
# 镜像源：用 1ms.run 代理（Docker Hub 官方源在 GitHub runner 上有匿名拉取限流，
# 共享 IP 极易触发 toomanyrequests；1ms.run 无此问题，上一轮 CI 已验证可用）。
env:
  CI_MYSQL_PORT: "13306"
  CI_REDIS_PORT: "16379"
  CI_MYSQL_PASSWORD: ktoms_dev_2026

jobs:
  backend:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Ruff lint
        run: uv run ruff check app tests
      - name: Mypy
        run: uv run mypy app --ignore-missing-imports

  backend-with-db:
    name: Backend (pytest + MySQL/Redis)
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: write   # 供失败时回写 ci-dbg 诊断分支
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup MySQL & Redis（使用 runner 自带服务）
        run: |
          # GitHub 的 ubuntu-latest runner **预装并运行 MySQL 8.0（3306）与 Redis（6379）**
          # ——这正是最初 services.ports=["3306:3306"] 与之抢占导致 job 秒挂的根因。
          # 官方推荐做法：直接用 runner 自带服务（零镜像拉取、无限流、无端口冲突）。
          # 本仓库用官方源之外的镜像（1ms.run）在本机可用、在 runner 不可达 → 不可依赖。
          sudo systemctl start mysql || sudo service mysql start
          sudo systemctl start redis-server || sudo service redis-server start
          echo "--- 服务状态 ---"
          sudo systemctl is-active mysql || true
          sudo systemctl is-active redis-server || true
          MYSQL_PORT=3306
          REDIS_PORT=6379
          for i in $(seq 1 60); do
            if mysqladmin ping -h 127.0.0.1 -P "$MYSQL_PORT" --silent >/dev/null 2>&1; then
              echo "MySQL 就绪（第${i}次探测）"; break
            fi
            if [ "$i" = "60" ]; then echo "::error::MySQL 启动超时"; exit 1; fi
            sleep 3
          done
          for i in $(seq 1 30); do
            if redis-cli -h 127.0.0.1 -p "$REDIS_PORT" ping 2>/dev/null | grep -q PONG; then
              echo "Redis 就绪（第${i}次探测）"; break
            fi
            if [ "$i" = "30" ]; then echo "::error::Redis 启动超时"; exit 1; fi
            sleep 2
          done

      - name: Load DDL（373 表）
        run: |
          for f in ../docs/database/sql/*.sql; do
            mysql -h 127.0.0.1 -P "$MYSQL_PORT" -uroot < "$f"
          done
          mysql -h 127.0.0.1 -P "$MYSQL_PORT" -uroot -N \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema LIKE 'oms_%';"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Seed 基础数据（组织树 + 超管）
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          uv sync --all-extras
          uv run python -m app.scripts.seed_org
          uv run python -m app.scripts.seed_auth
          uv run python -m app.scripts.seed_import

      - name: Pytest
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          set -o pipefail
          uv run pytest tests/ -q 2>&1 | tee /tmp/pytest.log

      - name: Check test-case doc is in sync
        run: |
          cd ..
          uv run --with pytest python tools/gen_test_doc.py --check

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs ktoms-ci-mysql 2>&1 | tail -30 || true
          docker logs ktoms-ci-redis 2>&1 | tail -10 || true

      - name: Self-diagnose to ci-dbg branch（失败时回写现场，供无 API 凭证环境排障）
        if: always()
        continue-on-error: true   # 诊断回写失败不得影响主流程结论
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          rm -rf /tmp/ci-dbg && mkdir -p /tmp/ci-dbg
          {
            echo "# CI self-diagnose (commit ${GITHUB_SHA})"
            echo "--- container ps ---"; docker ps -a --format "{{.Names}} {{.Status}} {{.Ports}}" || true
            echo "--- mysql tables ---"
            mysql -h 127.0.0.1 -P 3306 -uroot -N \
              -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema LIKE 'oms_%';" 2>&1 || true
            echo "--- start snapshot ---"; cat /tmp/ci-start.log 2>/dev/null || echo "(无启动快照)"
            echo "--- pytest tail ---"; tail -60 /tmp/pytest.log 2>/dev/null || echo "(无 pytest 日志)"
          } > /tmp/ci-dbg/status.txt
          cat /tmp/ci-dbg/status.txt
          cd /tmp/ci-dbg
          git init -q
          git config user.name "ktoms-ci"
          git config user.email "ci@ktoms.local"
          git add -A
          git commit -q -m "ci-dbg: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/ci-dbg

      - name: Cleanup
        if: always()
        run: echo "runner 自带服务，job 结束自动回收"

  mock-platform:
    name: Mock Platform (模拟器 pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mocks/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Pytest
        run: pytest tests/ -q

  # ============ 以下门禁与本地 deploy/ci-local-rehearsal.sh 保持一致 ============
  # 本地 12 项门禁 vs GitHub CI 原先只有 5 项 → 团队成员 PR 过的 CI 比本地松，
  # 协作质量闸门形同虚设。此处补齐缺失的 7 项。

  model-ddl:
    name: 模型 ↔ DDL 列一致性（W5/W6/W7 连续多轮踩过 DDL 列名坑）
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Check ORM ↔ information_schema
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          sudo systemctl start mysql || sudo service mysql start
          sudo systemctl start redis-server || sudo service redis-server start
          for i in $(seq 1 60); do
            mysqladmin ping -h 127.0.0.1 -P 3306 --silent >/dev/null 2>&1 && break
            sleep 3
          done
          for f in ../docs/database/sql/*.sql; do
            mysql -h 127.0.0.1 -P 3306 -uroot < "$f"
          done
          uv run python ../tools/check_model_ddl.py

  mock-wms:
    name: Mock WMS (模拟器 pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mocks/wms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 契约一致性（枚举/状态机 ↔ DDL 权威）
        working-directory: backend
        run: uv run python ../tools/check_contract_ddl.py
      - name: 架构门禁（模块边界 4 规则 · warn 模式）
        working-directory: backend
        run: uv run python ../tools/check_arch_rules.py
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Pytest
        run: pytest tests/ -q

  e2e:
    name: 端到端（场景矩阵 / 履约 / W7 通道 / 平台回传）
    runs-on: ubuntu-latest
    needs: backend-with-db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup MySQL & Redis（runner 自带服务）
        run: |
          sudo systemctl start mysql || sudo service mysql start
          sudo systemctl start redis-server || sudo service redis-server start
          for i in $(seq 1 60); do
            mysqladmin ping -h 127.0.0.1 -P 3306 --silent >/dev/null 2>&1 && break
            if [ "$i" = "60" ]; then echo "::error::MySQL 启动超时"; exit 1; fi
            sleep 3
          done
          for i in $(seq 1 30); do
            redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null | grep -q PONG && break
            if [ "$i" = "30" ]; then echo "::error::Redis 启动超时"; exit 1; fi
            sleep 2
          done
      - name: Load DDL（373 表）
        run: |
          for f in ../docs/database/sql/*.sql; do
            mysql -h 127.0.0.1 -P 3306 -uroot < "$f"
          done
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Sync dependencies + seed
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          uv sync --all-extras
          uv run python -m app.scripts.seed_org
          uv run python -m app.scripts.seed_auth
          uv run python -m app.scripts.seed_import
          uv run python -m app.scripts.seed_fulfill
          uv run python -m app.scripts.seed_wms
      # ⚠ --with-mock：E2E 自行拉起模拟器（标准端口 9000 平台 / 9001 WMS）
      - name: 业务场景端到端
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run python -m app.scripts.scenario_e2e --with-mock
      - name: 履约链路端到端
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run python -m app.scripts.fulfill_e2e
      - name: 造单场景矩阵端到端
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run python -m app.scripts.scenario_matrix_e2e --with-mock
      - name: W7 通道端到端
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run python -m app.scripts.wms_channel_e2e --with-mock
      - name: W7 平台回传端到端
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run python -m app.scripts.writeback_e2e --with-mock
      - name: M2 gate③ 三类异常单人工处置闭环
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run python -m app.scripts.m2_gate3_e2e
      - name: 跨域链路端到端（应急批次/转售后/看板/暂停恢复）
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: "3306"
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run python -m app.scripts.cross_domain_e2e

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build

  # CI 状态回写分支：把本轮各 job 结果写入 ci-status 分支的 status.txt。
  # 用途：便于在无 GitHub API 凭证的环境下（如本机走 SSH 通道）用 `git fetch origin ci-status`
  #       读到机器可读的 CI 结论，避免只能靠邮件判断。
  ci-status:
    name: CI Status (回写 ci-status 分支)
    runs-on: ubuntu-latest
    needs: [backend, backend-with-db, model-ddl, mock-platform, mock-wms, e2e, frontend]
    if: always()
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish status
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          R_BACKEND: ${{ needs.backend.result }}
          R_BACKEND_DB: ${{ needs.backend-with-db.result }}
          R_MOCK: ${{ needs.mock-platform.result }}
          R_FRONTEND: ${{ needs.frontend.result }}
        R_MODEL_DDL: ${{ needs.model-ddl.result }}
        R_MOCK_WMS: ${{ needs.mock-wms.result }}
        R_E2E: ${{ needs.e2e.result }}
        run: |
          set -e
          rm -rf /tmp/ci-status && mkdir -p /tmp/ci-status
          {
            echo "commit=${SHA}"
            echo "updated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "backend=${R_BACKEND}"
            echo "backend_with_db=${R_BACKEND_DB}"
            echo "mock_platform=${R_MOCK}"
            echo "frontend=${R_FRONTEND}"
            echo "model_ddl=${R_MODEL_DDL}"
            echo "mock_wms=${R_MOCK_WMS}"
            echo "e2e=${R_E2E}"
          } > /tmp/ci-status/status.txt
          cat /tmp/ci-status/status.txt
          cd /tmp/ci-status
          git init -q
          git config user.name "ktoms-ci"
          git config user.email "ci@ktoms.local"
          git add -A
          git commit -q -m "ci: ${SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/ci-status

      - name: Collect failed logs（供无 API 凭证环境排障）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          R_BACKEND: ${{ needs.backend.result }}
          R_BACKEND_DB: ${{ needs.backend-with-db.result }}
          R_MOCK: ${{ needs.mock-platform.result }}
          R_FRONTEND: ${{ needs.frontend.result }}
        R_MODEL_DDL: ${{ needs.model-ddl.result }}
        R_MOCK_WMS: ${{ needs.mock-wms.result }}
        R_E2E: ${{ needs.e2e.result }}
        run: |
          set -e
          rm -rf /tmp/ci-logs && mkdir -p /tmp/ci-logs
          {
            echo "# CI failure log digest (run ${RUN_ID})"
            echo "" >> /tmp/ci-logs/status.txt
            echo "===== backend: ${R_BACKEND} =====" >> /tmp/ci-logs/status.txt
            echo "===== backend-with-db: ${R_BACKEND_DB} =====" >> /tmp/ci-logs/status.txt
            echo "===== mock-platform: ${R_MOCK} =====" >> /tmp/ci-logs/status.txt
            echo "===== frontend: ${R_FRONTEND} =====" >> /tmp/ci-logs/status.txt
            {
              if [ "${R_BACKEND_DB}" = "failure" ] || [ "${R_BACKEND}" = "failure" ] \
                 || [ "${R_MOCK}" = "failure" ] || [ "${R_FRONTEND}" = "failure" ]; then
                gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>&1 | tail -150 || echo "(日志拉取失败)"
              fi
            } >> /tmp/ci-logs/status.txt
          } > /tmp/ci-logs/status.txt
          wc -l /tmp/ci-logs/status.txt
          cd /tmp/ci-logs
          git init -q
          git config user.name "ktoms-ci"
          git config user.email "ci@ktoms.local"
          git add -A
          git commit -q -m "ci-logs: ${RUN_ID}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs
