name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Ruff lint
        run: uv run ruff check app tests
      - name: Mypy
        run: uv run mypy app --ignore-missing-imports
      - name: Pytest（无 DB 用例；DB 用例需 services，见下方矩阵）
        run: uv run pytest tests/ -q -m "not db"

  backend-with-db:
    name: Backend (pytest + MySQL/Redis services)
    runs-on: ubuntu-latest
    needs: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ktoms_dev_2026
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -uroot -pktoms_dev_2026"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Load DDL（373 表）
        run: |
          for f in ../docs/database/sql/*.sql; do
            mysql -h 127.0.0.1 -uroot -pktoms_dev_2026 < "$f"
          done
          mysql -h 127.0.0.1 -uroot -pktoms_dev_2026 -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema LIKE 'oms_%';"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Sync + pytest (db marked)
        env:
          KTOMS_MYSQL_HOST: 127.0.0.1
          KTOMS_MYSQL_PORT: 3306
          KTOMS_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          uv sync --all-extras
          uv run pytest tests/ -q

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
