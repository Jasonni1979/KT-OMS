  - oms_oms_gateway.gw_msg_notify
  - oms_oms_gateway.gw_openapi_app
  - oms_oms_gateway.gw_openapi_log
  - oms_oms_gateway.gw_openapi_register
  - oms_oms_gateway.gw_order_buffer
  - oms_oms_gateway.gw_order_buffer_item
  - oms_oms_gateway.gw_order_buffer_promotion
