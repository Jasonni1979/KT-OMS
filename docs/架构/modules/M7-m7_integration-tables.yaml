external:
  - module: M1
    access: 读
  - module: M2
    access: 读
  - module: M3
    access: 写
  - module: M4
    access: 写
  - module: M5
    access: 写
forbidden_write:
  - oms_order.*
  - oms_fulfill.*
  - oms_stock.*
  - oms_aftersale.*
  - oms_base.bas_event_outbox（白名单除外）
shared_write:
  # 多写者白名单表（outbox 是事件基础设施，非业务数据）
  - oms_base.bas_event_outbox
