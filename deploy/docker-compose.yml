# KT-OMS 本地开发基建（M0.1）
# 用法: docker compose up -d && docker compose ps
# MySQL8 + Redis7 + RabbitMQ；373 表初始 DDL 挂载自动导入（首次初始化时按文件名顺序执行）
name: ktoms-dev

services:
  mysql:
    image: docker.1ms.run/mysql:8.0
    container_name: ktoms-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ktoms_dev_2026
    ports:
      - "3308:3306"          # 本机 3306/3307 已被占用，开发库用 3308
    volumes:
      - mysql_data:/var/lib/mysql
      # DDL 不用 initdb.d 挂载（工作区路径含冒号「OMS:WMS」，Docker 卷规格无法解析）
      # 初始化/重建用同目录 init-db.sh 从 stdin 导入
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pktoms_dev_2026"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: docker.1ms.run/redis:7-alpine
    container_name: ktoms-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: docker.1ms.run/rabbitmq:3.13-management-alpine
    container_name: ktoms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ktoms
      RABBITMQ_DEFAULT_PASS: ktoms_dev_2026
    ports:
      - "5673:5672"           # AMQP
      - "15673:15672"         # 管理台 http://localhost:15673 (ktoms/ktoms_dev_2026)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  mock-platform:
    # 淘系平台模拟器（V1.1 计划 §2.1/§2.2）：M1-M3 全程仿真开发，不依赖淘系测试环境
    build:
      context: ../mocks/platform
      dockerfile: Dockerfile
    container_name: ktoms-mock-platform
    environment:
      MOCK_TAOBAO_APP_KEY: mock_app_key
      MOCK_TAOBAO_APP_SECRET: mock_app_secret
      MOCK_TAOBAO_SESSIONS: sim_session_001
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
